name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: "8.2"
            testbench: "^10.11"
            phpunit: "^11.5"
            suite: "laravel-12"
          - php: "8.3"
            testbench: "^10.11"
            phpunit: "^11.5"
            suite: "laravel-12"
          - php: "8.3"
            testbench: "^11.1"
            phpunit: "^12.0"
            suite: "laravel-13"
          - php: "8.4"
            testbench: "^11.1"
            phpunit: "^12.0"
            suite: "laravel-13"
          - php: "8.5"
            testbench: "^11.1"
            phpunit: "^12.0"
            suite: "laravel-13"

    name: PHP ${{ matrix.php }} / ${{ matrix.suite }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Set matrix test constraints
        run: >
          composer require
          --dev
          --no-update
          --no-interaction
          "orchestra/testbench:${{ matrix.testbench }}"
          "phpunit/phpunit:${{ matrix.phpunit }}"

      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: highest
          composer-options: --no-interaction --no-progress --prefer-dist

      - name: Run test suite
        run: composer test

  analyse:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          coverage: none

      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: highest
          composer-options: --no-interaction --no-progress --prefer-dist

      - name: Validate composer.json
        run: composer validate --strict

      - name: Run static analysis
        run: composer analyse
